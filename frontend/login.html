<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Banking System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="auth-wrapper">
    <div class="auth-box">
      <h2 class="auth-title">Account Login</h2>

      <div id="login-alert" class="alert alert-danger"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-control" required placeholder="Enter username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        Don't have an account? <a href="register.html" style="color: var(--accent-color); font-weight: 600;">Register here</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const alertBox = document.getElementById('login-alert');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
          const res = await fetch(`${API_BASE_URL}/auth/token/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          if (res.ok) {
            const data = await res.json();
            setTokens(data.access, data.refresh);
            await loadUserProfile();
            window.location.href = 'dashboard.html';
          } else {
            const err = await res.json();
            alertBox.textContent = err.detail || 'Invalid username or password.';
            alertBox.style.display = 'block';
          }
        } catch (err) {
          alertBox.textContent = 'Network error connecting to backend API.';
          alertBox.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
